<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Códigos de Desconto | Casa Vinnus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<style>
  body { background: var(--cal); }
  .painel-wrap { max-width: 640px; margin: 0 auto; padding: 2rem 1.2rem 4rem; }
  .login-card {
    max-width: 380px; margin: 4rem auto; background: var(--branco);
    border: 1px solid rgba(70,66,68,0.15); border-radius: 4px; padding: 2rem;
    text-align: center;
  }
  .login-card input { width: 100%; padding: 0.75rem 0.9rem; margin: 1rem 0; border: 1px solid rgba(70,66,68,0.25); border-radius: 3px; font-size: 1rem; }
  button {
    background: var(--syrah); color: var(--branco); border: none;
    padding: 0.75rem 1.5rem; border-radius: 3px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem;
  }
  .form-novo { display: flex; gap: 0.6rem; margin-bottom: 2rem; }
  .form-novo input { flex: 1; padding: 0.75rem 0.9rem; border: 1px solid rgba(70,66,68,0.25); border-radius: 3px; text-transform: uppercase; }
  .lista-codigos { background: var(--branco); border: 1px solid rgba(70,66,68,0.15); border-radius: 4px; }
  .item-codigo {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.9rem 1.1rem; border-bottom: 1px solid rgba(70,66,68,0.08);
  }
  .item-codigo:last-child { border-bottom: none; }
  .item-codigo .nome { font-family: var(--serif); font-size: 1.1rem; }
  .item-codigo .data { font-size: 0.75rem; opacity: 0.6; }
  .btn-remover { background: none; color: var(--syrah); border: 1px solid var(--syrah); padding: 0.35rem 0.8rem; font-size: 0.7rem; }
  .vazio { text-align: center; opacity: 0.6; padding: 2rem 0; }
</style>
</head>
<body>

<div id="login-view" class="painel-wrap">
  <div class="login-card">
    <p style="font-family:var(--serif); font-size:1.4rem; margin-bottom:0.5rem;">Códigos de Desconto</p>
    <p style="font-size:0.85rem; opacity:0.7;">Casa Vinnus — acesso restrito à equipe</p>
    <input type="password" id="senha" placeholder="Senha de acesso">
    <button onclick="entrar()">Entrar</button>
    <p id="erro-login" style="color:var(--syrah); font-size:0.85rem; margin-top:1rem;"></p>
  </div>
</div>

<div id="painel-view" class="painel-wrap" style="display:none;">
  <p style="font-family:var(--serif); font-size:1.6rem; margin-bottom:0.4rem;">Códigos de Desconto</p>
  <p style="font-size:0.88rem; opacity:0.75; margin-bottom:1.5rem;">Qualquer código ativo aqui dá o valor de hóspede (R$160 vinho / R$105 suco) na página de agendamento.</p>

  <div class="form-novo">
    <input type="text" id="novoCodigo" placeholder="NOVOCODIGO" maxlength="20">
    <button onclick="criar()">Criar</button>
  </div>
  <p id="erro-criar" style="color:var(--syrah); font-size:0.85rem; margin-bottom:1.5rem;"></p>

  <div class="lista-codigos" id="lista"></div>
</div>

<script>
  var SENHA_KEY = 'painel-casa-vinnus-senha';

  function entrar() {
    sessionStorage.setItem(SENHA_KEY, document.getElementById('senha').value);
    mostrarPainel();
  }

  function mostrarPainel() {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('painel-view').style.display = 'block';
    carregar();
  }

  function carregar() {
    var senha = sessionStorage.getItem(SENHA_KEY);
    fetch('/api/codigos', { headers: { 'x-admin-secret': senha } })
      .then(function (r) {
        if (r.status === 401) throw new Error('senha');
        return r.json();
      })
      .then(function (data) { renderizar(data.codigos || []); })
      .catch(function (e) {
        if (e.message === 'senha') {
          sessionStorage.removeItem(SENHA_KEY);
          document.getElementById('login-view').style.display = 'block';
          document.getElementById('painel-view').style.display = 'none';
          document.getElementById('erro-login').textContent = 'Senha incorreta.';
        }
      });
  }

  function criar() {
    var senha = sessionStorage.getItem(SENHA_KEY);
    var codigo = document.getElementById('novoCodigo').value.trim();
    document.getElementById('erro-criar').textContent = '';
    fetch('/api/codigos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-secret': senha },
      body: JSON.stringify({ codigo: codigo })
    })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, body: d }; }); })
      .then(function (res) {
        if (res.status !== 200) {
          document.getElementById('erro-criar').textContent = res.body.erro || 'Não foi possível criar.';
          return;
        }
        document.getElementById('novoCodigo').value = '';
        carregar();
      });
  }

  function remover(codigo) {
    var senha = sessionStorage.getItem(SENHA_KEY);
    fetch('/api/codigos?codigo=' + encodeURIComponent(codigo), {
      method: 'DELETE',
      headers: { 'x-admin-secret': senha }
    }).then(carregar);
  }

  function renderizar(codigos) {
    var lista = document.getElementById('lista');
    if (codigos.length === 0) {
      lista.innerHTML = '<p class="vazio">Nenhum código criado ainda.</p>';
      return;
    }
    var html = '';
    codigos.forEach(function (c) {
      var data = new Date(c.criadoEm).toLocaleDateString('pt-BR');
      html += '<div class="item-codigo"><div><div class="nome">' + c.codigo + '</div><div class="data">criado em ' + data + '</div></div>';
      html += '<button class="btn-remover" onclick="remover(\'' + c.codigo + '\')">Remover</button></div>';
    });
    lista.innerHTML = html;
  }

  if (sessionStorage.getItem(SENHA_KEY)) mostrarPainel();
</script>

</body>
</html>
